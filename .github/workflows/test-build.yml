name: Vite Test Deployment

on:
  push:
    branches:
      - main
      - dev
      - feature/*
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build & deploy"
        required: true
        default: "dev"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout selected branch (important fix)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build Vite project
      - name: Build
        run: npm run build

      # 5. Deploy to GitHub Pages (test environment)
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
